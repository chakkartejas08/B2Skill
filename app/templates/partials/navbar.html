<header class="border-b border-steel bg-paper/95 backdrop-blur sticky top-0 z-40">
  <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
    <a href="{{ url_for('main.landing') }}" class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-signal"></span>
      <span class="font-display text-xl font-semibold tracking-tight text-ink">B2Skill <span class="text-growth">AI</span></span>
    </a>

    <div class="hidden md:flex items-center gap-8 text-[15px] text-inkmuted">
      <a href="{{ url_for('main.landing') }}#how-it-works" class="hover:text-ink transition-colors">How It Works</a>
      <a href="{{ url_for('main.landing') }}#for-businesses" class="hover:text-ink transition-colors">For Businesses</a>
      <a href="{{ url_for('main.landing') }}#for-students" class="hover:text-ink transition-colors">For Students</a>
      <a href="{{ url_for('projects.browse') }}" class="hover:text-ink transition-colors">Projects</a>
      <a href="{{ url_for('main.about') }}" class="hover:text-ink transition-colors">About</a>
    </div>

    <div class="flex items-center gap-3">
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="p-2 text-inkmuted hover:text-ink rounded-full transition-colors">
        <svg class="icon-moon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
        <svg class="icon-sun w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
      </button>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('notifications.index') }}" class="relative p-2 text-inkmuted hover:text-ink" aria-label="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
          </svg>
          {% if unread_notification_count and unread_notification_count > 0 %}
            <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-signal"></span>
          {% endif %}
        </a>
        <a href="{{ url_for('main.dashboard') }}" class="px-4 py-2 text-sm font-medium text-ink hover:text-growth transition-colors">Dashboard</a>
        <a href="{{ url_for('auth.logout') }}" class="px-4 py-2 rounded-full text-sm font-medium bg-ink text-paper hover:bg-ink/90 transition-colors">Log out</a>
      {% else %}
        <a href="{{ url_for('auth.login') }}" class="px-4 py-2 text-sm font-medium text-ink hover:text-growth transition-colors">Log in</a>
        <a href="{{ url_for('auth.register') }}" class="px-5 py-2.5 rounded-full text-sm font-medium bg-signal text-ink hover:bg-signaldark transition-colors">Get Started</a>
      {% endif %}
    </div>
  </nav>
</header>
